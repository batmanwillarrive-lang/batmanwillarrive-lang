<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Hi, I'm Rao Talha Imam - Shopify and Headless Commerce Specialist" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f2418">
        <animate attributeName="stop-color" values="#0f2418;#10222e;#1c1330;#0f2418" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#7AB55C"/>
      <stop offset="50%" stop-color="#38B2AC"/>
      <stop offset="100%" stop-color="#B388FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 500 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#7AB55C"/>
      <stop offset="50%" stop-color="#38B2AC"/>
      <stop offset="100%" stop-color="#B388FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 1000 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="clip1"><rect x="249" y="170" width="0" height="40">
      <animate attributeName="width" dur="9s" repeatCount="indefinite"
        values="0;502;502;502;0" keyTimes="0;0.30;0.85;0.97;1"/>
    </rect></clipPath>
    <clipPath id="clip2"><rect x="256" y="212" width="0" height="40">
      <animate attributeName="width" dur="9s" repeatCount="indefinite"
        values="0;0;488;488;0" keyTimes="0;0.30;0.58;0.97;1"/>
    </rect></clipPath>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Courier, monospace; }
    .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .float1 { animation: f1 6s ease-in-out infinite; }
    .float2 { animation: f2 7s ease-in-out infinite; }
    .float3 { animation: f3 8s ease-in-out infinite; }
    .float4 { animation: f1 9s ease-in-out infinite reverse; }
    @keyframes f1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes f2 { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(12px) rotate(6deg); } }
    @keyframes f3 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(12px); } }
    .intro { animation: fadein 1.4s ease-out both; }
    .name  { animation: rise 1.2s ease-out 0.3s both; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .wave { transform-origin: 580px 72px; animation: wave 2.2s ease-in-out infinite; }
    @keyframes wave { 0%,60%,100% { transform: rotate(0deg); } 10%,30% { transform: rotate(16deg); } 20%,40% { transform: rotate(-10deg); } 50% { transform: rotate(8deg); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  </style>

  <!-- background -->
  <rect x="2" y="2" width="996" height="296" rx="18" fill="url(#bg)"/>

  <!-- soft glowing blobs -->
  <circle cx="120" cy="60" r="90" fill="#7AB55C" opacity="0.07" class="float1"/>
  <circle cx="880" cy="250" r="110" fill="#B388FF" opacity="0.07" class="float2"/>
  <circle cx="860" cy="50" r="70" fill="#38B2AC" opacity="0.07" class="float3"/>

  <!-- floating code symbols -->
  <g class="mono" font-size="34" font-weight="bold">
    <text x="70"  y="120" fill="#7AB55C" opacity="0.55" class="float1">{ }</text>
    <text x="130" y="250" fill="#38B2AC" opacity="0.5"  class="float2">&lt;/&gt;</text>
    <text x="820" y="120" fill="#B388FF" opacity="0.55" class="float3">{{ }}</text>
    <text x="660" y="280" fill="#7AB55C" opacity="0.5"  class="float4">$</text>
    <text x="905" y="190" fill="#38B2AC" opacity="0.5"  class="float1">=&gt;</text>
    <text x="40"  y="200" fill="#B388FF" opacity="0.45" class="float4">( )</text>
  </g>

  <!-- greeting -->
  <g class="intro sans">
    <text x="500" y="82" text-anchor="middle" font-size="30" font-weight="600" fill="#c9d1d9">Hi, I'm</text>
    <text x="566" y="82" font-size="30" class="wave">👋</text>
  </g>

  <!-- name -->
  <g class="name">
    <text x="500" y="150" text-anchor="middle" class="sans" font-size="70" font-weight="800"
          fill="url(#title)" filter="url(#glow)">Rao Talha Imam</text>
  </g>

  <!-- typed lines -->
  <g clip-path="url(#clip1)">
    <text x="249" y="197" class="mono" font-size="22" font-weight="bold" fill="#e6edf3"
          textLength="502" lengthAdjust="spacingAndGlyphs">Shopify &amp; Headless Commerce Specialist</text>
  </g>
  <g clip-path="url(#clip2)">
    <text x="256" y="238" class="mono" font-size="22" fill="#7AB55C"
          textLength="488" lengthAdjust="spacingAndGlyphs">Liquid • Hydrogen • WordPress • React</text>
  </g>

  <!-- blinking cursor -->
  <rect x="754" y="218" width="10" height="22" fill="#7AB55C" class="pulse"/>

  <!-- animated border -->
  <rect x="2" y="2" width="996" height="296" rx="18" fill="none" stroke="url(#border)" stroke-width="2.5"/>
</svg>
